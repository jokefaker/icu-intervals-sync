name: Sync Intervals ICU Segments

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod

    env:
      INTERVALS_ICU_AUTH_USERNAME: API_KEY
      INTERVALS_ICU_AUTH_PASSWORD: ${{ secrets.INTERVALS_ICU_AUTH_PASSWORD }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
      APP_TIMEZONE: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync today's activities
        run: python main.py
